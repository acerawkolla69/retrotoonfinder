[build]
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/tmdb"
  to = "/.netlify/functions/tmdb"
  status = 200
  force = true

[[redirects]]
  from = "/api/watchmode"
  to = "/.netlify/functions/watchmode"
  status = 200
  force = true

[[redirects]]
  from = "/api/youtube"
  to = "/.netlify/functions/youtube"
  status = 200
  force = true
```

